{% extends 'base.html' %}{% block content %}<div class="login card"><h1>Acesso Restrito</h1><p class="muted">Central Integrada de Alternativas Penais</p><form method="post"><label>E-mail<input name="email" type="email" required></label><label>Senha<div class="password-input"><input name="senha" type="password" required autocomplete="current-password" data-password-input><button class="password-toggle" type="button" data-password-toggle aria-label="Mostrar senha" title="Mostrar senha" aria-pressed="false"><svg data-password-visible viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg><svg data-password-hidden viewBox="0 0 24 24" aria-hidden="true" hidden><path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a15.8 15.8 0 0 1-3.1 3.9M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10.5 10.5 0 0 0 4.1-.8"/></svg></button></div></label><div class="actions"><button>Entrar</button><a class="btn alt" href="{{ url_for('cadastro') }}">Solicitar Acesso</a></div></form><section class="password-recovery"><h2>Esqueci a Senha do Login</h2><form method="post" action="{{ url_for('solicitar_recuperacao_senha') }}"><label>E-mail de Cadastro<input name="email_recuperacao" type="email" autocomplete="email" required></label><button class="btn alt" type="submit">Solicitar Recuperação</button></form></section></div>{% endblock %}
