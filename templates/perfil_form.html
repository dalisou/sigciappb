{% extends 'base.html' %}
{% block content %}
<h1>{{ title }}</h1>
<div class="card">
	<form method="post">
		<div class="grid">
			<label>Nome<input name="nome" value="{{ user.nome }}" required></label>
			<label>E-mail<input name="email" type="email" value="{{ user.email }}" required></label>
			<label>Cargo<input name="cargo" value="{{ user.cargo or '' }}" maxlength="120"></label>
			<label>Matrícula<input name="matricula" value="{{ user.matricula or '' }}" maxlength="80"></label>
			<label id="conselho-regional-field">Conselho Regional (CRP, CRESS, OAB)<input name="conselho_regional" value="{{ user.conselho_regional or '' }}" maxlength="120"></label>
			<label>Perfil<select name="perfil" required>
				<option value="administrador" {% if user.perfil == 'administrador' %}selected{% endif %}>Administrador</option>
				<option value="profissional_psicologo" {% if user.perfil == 'profissional_psicologo' %}selected{% endif %}>Profissional Psicólogo</option>
				<option value="profissional_assistente_social" {% if user.perfil == 'profissional_assistente_social' %}selected{% endif %}>Profissional Assistente Social</option>
				<option value="profissional_advogado" {% if user.perfil == 'profissional_advogado' %}selected{% endif %}>Profissional Advogado</option>
				<option value="profissional_administrativo" {% if user.perfil == 'profissional_administrativo' %}selected{% endif %}>Profissional Administrativo</option>
			</select></label>
			<label>Status<select name="status" required><option value="pendente" {% if user.status == 'pendente' %}selected{% endif %}>Pendente</option><option value="aprovado" {% if user.status == 'aprovado' %}selected{% endif %}>Aprovado</option><option value="rejeitado" {% if user.status == 'rejeitado' %}selected{% endif %}>Rejeitado</option></select></label>
			<label>Nova senha (opcional)<div class="password-input"><input name="senha" type="password" minlength="6" pattern="[A-Za-z0-9]{6,}" autocomplete="new-password" data-password-input><button class="password-toggle" type="button" data-password-toggle aria-label="Mostrar senha" title="Mostrar senha" aria-pressed="false"><svg data-password-visible viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg><svg data-password-hidden viewBox="0 0 24 24" aria-hidden="true" hidden><path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a15.8 15.8 0 0 1-3.1 3.9M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10.5 10.5 0 0 0 4.1-.8"/></svg></button></div><small>Deixe em branco para manter a senha atual. Mínimo de 6 caracteres alfanuméricos.</small></label>
		</div>
		<div class="actions"><button>Salvar alterações</button><a class="btn alt" href="{{ url_for('perfis') }}">Cancelar</a></div>
	</form>
</div>
<script>
	const profileSelect = document.querySelector('select[name="perfil"]');
	const regionalCouncilField = document.querySelector('#conselho-regional-field');
	const multidisciplinaryProfiles = new Set([
		'profissional_psicologo',
		'profissional_assistente_social',
		'profissional_advogado',
	]);
	const updateRegionalCouncilField = () => {
		const enabled = multidisciplinaryProfiles.has(profileSelect?.value);
		if (regionalCouncilField) regionalCouncilField.hidden = !enabled;
	};
	profileSelect?.addEventListener('change', updateRegionalCouncilField);
	updateRegionalCouncilField();
</script>
{% endblock %}
